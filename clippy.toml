msrv = "1.99"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
avoid-breaking-exported-api = false
check-private-items = false          # true flags private #[test] fns for missing_panics_doc
too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 6
disallowed-methods = [
  { path = "std::env::set_var", reason = "process-global and unsafe in edition 2024" },
  { path = "std::process::exit", reason = "return an error from main instead" },
  { path = "std::thread::sleep", reason = "use tokio::time::sleep in async code" },
]
